<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background: transparent;">
    <defs>
        <!-- Apple Definition -->
        <g id="apple">
            <!-- Drop Shadow -->
            <circle cx="4" cy="6" r="35" fill="rgba(0,0,0,0.2)"/>
            <!-- Apple Body -->
            <circle cx="0" cy="0" r="35" fill="#7cb342" stroke="#1b5e20" stroke-width="4"/>
            <!-- Highlight Curve -->
            <path d="M -15 -18 A 20 20 0 0 1 -2 -28" stroke="#aed581" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Stem -->
            <path d="M 0 -32 Q -5 -45 -10 -48" stroke="#5d4037" stroke-width="4" stroke-linecap="round" fill="none"/>
            <!-- Leaf -->
            <path d="M 0 -32 C 15 -50 30 -30 5 -25 Z" fill="#4caf50" stroke="#1b5e20" stroke-width="3" stroke-linejoin="round"/>
        </g>

        <!-- Orange Definition -->
        <g id="orange">
            <!-- Drop Shadow -->
            <circle cx="4" cy="6" r="35" fill="rgba(0,0,0,0.2)"/>
            <!-- Orange Body -->
            <circle cx="0" cy="0" r="35" fill="#fb8c00" stroke="#e65100" stroke-width="4"/>
            <!-- Highlight Curve -->
            <path d="M -15 -18 A 20 20 0 0 1 -2 -28" stroke="#ffb74d" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Dimple/Stem Mark -->
            <circle cx="0" cy="-28" r="2.5" fill="#e65100"/>
            <path d="M -4 -30 Q 0 -26 4 -30" stroke="#e65100" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <!-- Cartoon Texture Pores -->
            <circle cx="10" cy="10" r="1.5" fill="#e65100" opacity="0.6"/>
            <circle cx="-10" cy="15" r="1.5" fill="#e65100" opacity="0.6"/>
            <circle cx="15" cy="-5" r="1.5" fill="#e65100" opacity="0.6"/>
            <circle cx="-15" cy="0" r="1.5" fill="#e65100" opacity="0.6"/>
            <circle cx="0" cy="18" r="1.5" fill="#e65100" opacity="0.6"/>
        </g>
    </defs>

    <!-- RED BOX -->
    <g id="red-box">
        <!-- Box Inner Base -->
        <rect x="50" y="40" width="300" height="320" fill="#c62828" rx="10"/>
        
        <!-- Inner Box Shadows for Depth -->
        <rect x="60" y="50" width="280" height="15" fill="rgba(0,0,0,0.2)"/>
        <rect x="60" y="50" width="15" height="300" fill="rgba(0,0,0,0.2)"/>

        <!-- Fruits (Grid spacing: 90px horizontally, 90px vertically) -->
        <!-- Row 1 -->
        <use href="#apple" x="110" y="110"/>
        <use href="#apple" x="200" y="110"/>
        
        <!-- Row 2 -->
        <use href="#orange" x="110" y="200"/>
        <use href="#orange" x="200" y="200"/>
        <use href="#orange" x="290" y="200"/>
        
        <!-- Row 3 -->
        <use href="#orange" x="110" y="290"/>
        <use href="#orange" x="200" y="290"/>
        <use href="#orange" x="290" y="290"/>

        <!-- Box Rim and Cartoon Outlines -->
        <rect x="50" y="40" width="300" height="320" fill="none" stroke="#f44336" stroke-width="20" rx="15"/>
        <rect x="40" y="30" width="320" height="340" fill="none" stroke="#2c3e50" stroke-width="6" rx="20"/>
        <rect x="60" y="50" width="280" height="300" fill="none" stroke="#2c3e50" stroke-width="6" rx="10"/>
    </g>

    <!-- BLUE BOX -->
    <g id="blue-box">
        <!-- Box Inner Base -->
        <rect x="450" y="40" width="300" height="320" fill="#1565c0" rx="10"/>
        
        <!-- Inner Box Shadows for Depth -->
        <rect x="460" y="50" width="280" height="15" fill="rgba(0,0,0,0.2)"/>
        <rect x="460" y="50" width="15" height="300" fill="rgba(0,0,0,0.2)"/>

        <!-- Fruits (Grid spacing matches the red box) -->
        <!-- Row 1 (Empty) -->
        
        <!-- Row 2 -->
        <use href="#orange" x="510" y="200"/>
        
        <!-- Row 3 -->
        <use href="#apple" x="510" y="290"/>
        <use href="#apple" x="600" y="290"/>
        <use href="#apple" x="690" y="290"/>

        <!-- Box Rim and Cartoon Outlines -->
        <rect x="450" y="40" width="300" height="320" fill="none" stroke="#2196f3" stroke-width="20" rx="15"/>
        <rect x="440" y="30" width="320" height="340" fill="none" stroke="#2c3e50" stroke-width="6" rx="20"/>
        <rect x="460" y="50" width="280" height="300" fill="none" stroke="#2c3e50" stroke-width="6" rx="10"/>
    </g>
</svg>
