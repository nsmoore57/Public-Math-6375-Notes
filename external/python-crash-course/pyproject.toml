[project]
name = "pythoncrashcourse"
version = "0.1.0"
description = "Environment to Develop Python Crash Course"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.15.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "otter-grader>=6.1.6",
    "plotly>=6.9.0",
    "scipy>=1.18.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[tool.uv]
preview-features = ["centralized-project-envs"]
